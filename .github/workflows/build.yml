# Incremental HonestB0Search / Level26 CI for v28/v29
# algebraic props. Does **not** `lake build` the default
# BealMatveevBeal target (that is the hours-long historical
# job on main.yml). Stone pin: phase-darmon-merel-4413 @
# a93402e, mathlib v4.12.0 =
# 809c3fb3b5c8f5d7dace56e200b426187516535a, conjecture
# v27 badge 6ccafbf.
name: HonestB0Search incremental

on:
  push:
    branches:
      - phase-darmon-merel-4413
      - tate-neron-v28
      - mazur-cusps-v28
      - ribet-no-newforms-v28
      - kolyvagin-fintype-subsingleton-v28
      - tate-neron-final-v29
      - mazur-no-isogeny-final-v29
      - ribet-928-to-32-final-v29
      - kolyvagin-rank0-final-v29
      - chore-v30-structural-verification-docs
      - rename-honest-lean-names
  workflow_dispatch:

concurrency:
  group: honestb0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore .lake stone cache
        id: lake-cache
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-v27-6ccafbf
          restore-keys: |
            lake-

      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: true
          build: false
          test: false

      - name: lake exe cache get
        run: lake exe cache get

      - name: Incremental Tate
        run: lake build +Tate_Frey_Conductor_29_Neron_inhabited

      - name: Incremental Tate final v29
        run: lake build +Tate_Frey_Conductor_29_Neron_final

      - name: Incremental Mazur
        run: lake build +Mazur_X0_13_Cusps_Equals_Rationals_inhabited

      - name: Incremental Mazur final v29
        run: lake build +Mazur_X0_13_No_Isogeny_final

      - name: Incremental Ribet
        run: lake build +Ribet_No_Newforms_At_32_inhabited

      - name: Incremental Ribet final v29
        run: lake build +Ribet_Level_Lowering_29_to_32_final

      - name: Incremental Kolyvagin
        run: lake build +Kolyvagin_Fintype_Subsingleton_inhabited

      - name: Incremental Kolyvagin final v29
        run: lake build +Kolyvagin_MW_Rank0_26a1_26b1_final

      - name: lake build HonestB0Search
        run: lake build HonestB0Search

      - name: lake build Level26
        run: lake build Level26
