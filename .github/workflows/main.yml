# Matveev–Beal CI (foundations-level-26).
# Honest AMS / Math. Comp. surface: lake build of BealMatveevBeal
# succeeds with exactly one sorry (matveev_gap3_lower at line 716).
# Does not build the relocated v24.4.0 scaffold targets
# BealLevel26FoundationsScaffold / BealLevel26FoundationsReal.
name: Matveev-Beal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: matveev-beal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore Lean toolchain and Mathlib cache
        id: lean-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            ~/.elan/update-hashes
            .lake/packages
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}

      - name: Get Mathlib binary cache
        run: lake exe cache get

      - name: Build BealMatveevBeal
        run: lake build BealMatveevBeal

      - name: Honest AMS referee surface
        run: bash scripts/verify-matveev-beal.sh
